# Publishes both applications and the guide on GitHub Pages, https://pnguyen9.github.io/Cyberdeck/,
# on each release tag (v3.4.0…), or by hand from the Actions tab. Only the latest version is online;
# the address never changes, so what people keep in their browser stays from one version to the next.
# Once, in the repository's settings: Pages → Source must be "GitHub Actions", and Environments →
# github-pages → Deployment branches and tags must allow the tags `v*` (add a tag rule): by default
# the environment accepts the default branch alone, and refuses a run started by a tag.
name: Pages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publication at a time; one under way is finished rather than cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
